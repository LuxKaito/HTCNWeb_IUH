<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chủ</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <script src="../js/jquery-3.7.1.min.js"></script>
    <script src="../js/bootstrap.min.js"></script>
    <style>
        .mauDo {
            font-size: 100%;
            color: red;
        }
        
        [class*="col-"] {
            padding-right: 0;
            padding-left: 0;
        }
        
        li {
            width: 150px;
        }
    </style>
    <script>
        $(document).ready(function() {
            var i = 2;
            $("#btnDK").click(function() {
                $("#myModal").modal("show");
            });

            function kiemTraMa() {
                var mauKT = /^[0-9]{9}$/;
                if ($("#txtMa").val() === "") {
                    $("#tbMa").html("Bắt buộc nhập").addClass("mauDo");
                } else if (!mauKT.test($("#txtMa").val())) {
                    $("#tbMa").html("Nhập sai").addClass("mauDo");
                } else {
                    $("#tbMa").html("*").removeClass("mauDo");
                }
            }
            $("#txtMa").blur(kiemTraMa);

            function kiemTraHT() {
                var kt = /(^[A-Z]{1}[a-z]+)(\s[A-Z]{1}[a-z]*)+/;
                if ($("#txtHT").val() === "") {
                    $("#tbTen").html("Nhập sai").addClass("mauDo");
                    return false;
                }
                if (!kt.test($("#txtHT").val())) {
                    $("#tbTen").html("Chữ cái đầu của mỗi từ phải viết hoa!!").addClass("mauDo");
                    return false;
                }
                $("#tbTen").html("*").removeClass("mauDo");
                return true;
            }
            $("#txtHT").blur(kiemTraHT);

            function kiemTraDC() {
                var mauKT = /^[a-zA-Z0-9-_]{3,15}$/;
                if ($("#txtDC").val() === "") {
                    $("#tbDC").html("Bắt buộc nhập").addClass("mauDo");
                    return false;
                }
                if (!mauKT.test($("#txtDC").val())) {
                    $("#tbDC").html("Nhập sai").addClass("mauDo");
                    return false;
                }
                $("#tbDC").html("*").removeClass("mauDo");
                return true;
            }
            $("#txtDC").blur(kiemTraDC);

            $("#slGia").change(function() {
                $("#slGia option:selected").each(function() {
                    $("#txtDV").val($(this).val());
                });
            });

            $(".chkDoDung").click(function() {
                var tienDD = 0;
                $(".chkDoDung:checked").each(function() {
                    tienDD += parseFloat($(this).val());
                });
                $("#txtDD").val(tienDD);
                var tong = parseFloat($("#txtDD").val()) + parseFloat($("#txtDV").val());
                $("#txtTong").val(tong);
            });

            $("#btnSave").click(function() {
                var ma = $("#txtMa").val();
                var ht = $("#txtHT").val();
                var dc = $("#txtDC").val();
                var tdv = $("#txtDV").val();
                var tdd = $("#txtDD").val();
                var tong = $("#txtTong").val();
                var them = "<tr><td>" + (i++) + "</td><td>" + ma + "</td><td>" + ht + "</td><td>" + dc + "</td><td>" + tdv + "</td><td>" + tdd + "</td><td>" + tong + "</td></tr>";
                $("#tbDanhsach").append(them);
                $("#myModal").modal("hide");
                return true;
            });
        });
    </script>
</head>

<body>
    <div class="container border">
        <div class="row">
            <div class="col-12">
                <img src="../image/Header.PNG" alt="" width="100%">
            </div>
        </div>
        <div class="row">
            <nav class="navbar">
                <ul class="nav nav-expand">
                    <li class="nav-item"><a href="#" class="nav-link">Trang chủ</a></li>
                    <li class="nav-item"><a href="#" class="nav-link" id="btnDK">Đăng ký</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">Trợ giúp</a></li>
                </ul>
            </nav>
        </div>

        <div class="row">
            <table class="table-bordered table-light table-primary table-hover table-striped" id="tbDanhsach">
                <tr>
                    <th>STT</th>
                    <th>Mã học viên</th>
                    <th>Họ tên</th>
                    <th>Email</th>
                    <th>Tiền dịch vụ</th>
                    <th>Tiền đồ dùng</th>
                    <th>Tổng tiền</th>
                </tr>
                <tr>
                    <td>1</td>
                    <td>123456789</td>
                    <td>Trần Anh</td>
                    <td>hongquan@iuh.edu.vn</td>
                    <td>30000</td>
                    <td>10000</td>
                    <td>40000</td>
                </tr>
            </table>
        </div>
        <div class="row">
            <div class="modal fade" id="myModal" tabindex="-1" aria-labelledby="myModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="myModalLabel">THÔNG TIN THANH TOÁN</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <form class="form-control">
                                <div class="row form-group p-1">
                                    <div class="col-4 col-sm-3">
                                        <label for="txtMa">Mã học viên:</label>
                                    </div>
                                    <div class="col-6 col-sm-6">
                                        <input type="text" class="form-control" placeholder="123456789" id="txtMa">
                                    </div>
                                    <div class="col-2 col-sm-3 p-2">
                                        <span id="tbMa">*</span>
                                    </div>
                                </div>
                                <div class="row form-group p-1">
                                    <div class="col-4 col-sm-3">
                                        <label for="txtHT">Họ tên:</label>
                                    </div>
                                    <div class="col-6 col-sm-6">
                                        <input type="text" id="txtHT" class="form-control" placeholder="Tran Thu Trang">
                                    </div>
                                    <div class="col-2 col-sm-3 p-2">
                                        <span id="tbTen">*</span>
                                    </div>
                                </div>
                                <div class="row form-group p-1">
                                    <div class="col-4 col-sm-3">
                                        <label for="txtDC">Email:</label>
                                    </div>
                                    <div class="col-6 col-sm-6">
                                        <input type="email" class="form-control" placeholder="trangtran@iuh.edu.vn" id="txtDC">
                                    </div>
                                    <div class="col-2 col-sm-3 p-2">
                                        <span id="tbEmail">*</span>
                                    </div>
                                </div>
                                <div class="row form-group p-1">
                                    <div class="col-4 col-sm-3">
                                        <label for="slGia">Dịch vụ:</label>
                                    </div>
                                    <div class="col-6 col-sm-6">
                                        <select name="gia" class="form-control" id="slGia">
                                            <option value="2000">Bơi</option>
                                            <option value="3888">Trượt ván</option>
                                            <option value="5000">Moto nước</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="row form-group p-1">
                                    <div class="col-4 col-sm-3">
                                        <label for="txtDV">Giá tiền:</label>
                                    </div>
                                    <div class="col-8 col-sm-6">
                                        <input type="text" name="txtDV" id="txtDV" class="form-control" disabled>
                                    </div>
                                </div>
                                <div class="row p-1">
                                    <div class="col-4 col-sm-3">
                                        <label for="">Đồ dùng:</label>
                                    </div>
                                    <div class="col-8 col-sm-6">
                                        <input type="checkbox" name="chkDoDung" class="chkDoDung" value="20099" /> Áo quần
                                    </div>
                                </div>
                                <div class="row p-1">
                                    <div class="col-4 col-sm-3">
                                        <label for=""></label>
                                    </div>
                                    <div class="col-8 col-sm-6">
                                        <input type="checkbox" name="chkDoDung" class="chkDoDung" value="50000" /> Phao
                                    </div>
                                </div>
                                <div class="row p-1">
                                    <div class="col-4 col-sm-3">
                                        <label for=""></label>
                                    </div>
                                    <div class="col-8 col-sm-6">
                                        <input type="checkbox" name="chkDoDung" class="chkDoDung" value="78800" /> Kính bơi
                                    </div>
                                </div>
                                <div class="row p-1">
                                    <div class="col-4 col-sm-3">
                                        <label for="txtDD">Tiền đồ dùng:</label>
                                    </div>
                                    <div class="col-8 col-sm-6">
                                        <input type="text" name="txtDD" id="txtDD" class="form-control" value="0" disabled>
                                    </div>
                                </div>
                                <div class="row p-1">
                                    <div class="col-4 col-sm-3">
                                        <label for="txtTong">Tổng tiền:</label>
                                    </div>
                                    <div class="col-8 col-sm-6">
                                        <input type="text" name="txtTong" id="txtTong" class="form-control" disabled>
                                    </div>
                                </div>
                                <div class="row p-1">
                                    <div class="col-sm-12">
                                        <div class="d-flex justify-content-between">
                                            <input type="button" value="Thanh toán" id="btnSave" class="btn btn-success flex-fill w-100">
                                            <input type="reset" value="Hủy" class="btn btn-danger flex-fill w-100">
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer text-end">
                            <h4>Trang thanh toán</h4>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-4 col-md-4">
                <h6>Mã sinh viên:____________</h6>
            </div>
            <div class="col-4 col-md-4">
                <h6>Họ tên:____________</h6>
            </div>
            <div class="col-4 col-md-4">
                <h6>Phòng thi:____________</h6>
            </div>
        </div>
    </div>
</body>

</html>
